<body>
<a class="skip" href="#cmd">Skip to command</a>

<div class="stage">
  <section class="win" id="win" aria-label="Terminal">
    <header class="tb">
      <span class="dots">
        <button class="dot dot--x" id="btnClose" type="button" aria-label="Reset terminal"></button>
        <button class="dot dot--m" id="btnMin" type="button" aria-label="Minimize"></button>
        <button class="dot dot--M" id="btnMax" type="button" aria-label="Maximize"></button>
      </span>
      <div class="title" id="winTitle">sami@nova — zsh</div>
      <button class="helpbtn" id="btnHelp" type="button" title="help">?</button>
    </header>

    <div class="scroll" id="out" tabindex="-1"></div>

    <div class="composer">
      <div class="row">
        <div class="ps1"><span class="ok">sami</span><span class="at">@</span><span class="acc">nova</span> <span class="path">~</span> %</div>
        <form id="form" autocomplete="off">
          <input id="cmd" type="text" name="cmd" spellcheck="false" aria-label="Command" autocapitalize="off" autocorrect="off" />
        </form>
        <span class="cursor" aria-hidden="true"></span>
      </div>
      <div class="suggest" id="suggest">
        <b>Suggestions</b>
        <div class="hits" id="hits"></div>
      </div>
    </div>

    <footer class="status">
      <span>zsh</span>
      <em id="statusMid">type help · tab to complete · shift+tab theme</em>
      <span id="clock">00:00:00</span>
    </footer>
  </section>

  <nav class="chips" aria-label="Shortcuts">
    <button class="chip" type="button" data-run="whoami">whoami</button>
    <button class="chip" type="button" data-run="now">now</button>
    <button class="chip" type="button" data-run="projects">projects</button>
    <button class="chip" type="button" data-run="stack">stack</button>
    <button class="chip" type="button" data-run="resume">resume</button>
    <button class="chip" type="button" data-run="contact">contact</button>
    <button class="chip" type="button" data-run="help">help</button>
  </nav>
</div>
